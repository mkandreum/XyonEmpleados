services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-xyonempleados_db}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@xyonempleados.com}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    volumes:
      - uploads:/app/uploads
    command:
      - sh
      - -c
      - |
        set -eu
        # ── Validate required env vars at runtime ──
        if [ -z "$JWT_SECRET" ]; then echo "[FATAL] JWT_SECRET is required"; exit 1; fi
        if [ -z "$ADMIN_INITIAL_PASSWORD" ]; then echo "[FATAL] ADMIN_INITIAL_PASSWORD is required"; exit 1; fi
        if [ "$${#JWT_SECRET}" -lt 32 ]; then echo "[FATAL] JWT_SECRET must be at least 32 chars"; exit 1; fi
        if [ -z "$POSTGRES_PASSWORD" ]; then echo "[FATAL] POSTGRES_PASSWORD is required"; exit 1; fi
        # ── Build DATABASE_URL with URL-encoded password (handles special chars) ──
        DB_PASS_ENCODED=$(node -e "console.log(encodeURIComponent(process.env.POSTGRES_PASSWORD))")
        export DATABASE_URL="postgresql://${POSTGRES_USER}:${DB_PASS_ENCODED}@db:5432/${POSTGRES_DB}"
        echo "[app] DATABASE_URL built → connecting to db:5432/${POSTGRES_DB}"
        # ── Volume ownership, then drop root privileges ──
        # Best-effort: the volume files are already owned by 'node'. Do not abort startup if
        # chown is denied (e.g. rootless Docker), which would otherwise crash-loop the container.
        chown -R node:node /app/uploads 2>/dev/null || true
        # Automatic migration: backup + pending SQL + additive schema sync (see backend/prisma/runMigrations.js).
        # Give up after 10 attempts so the deployment is marked as failed instead of looping forever.
        attempt=1
        until su-exec node npm run prisma:migrate; do
          if [ "$$attempt" -ge 10 ]; then echo "[FATAL] migrations failed 10 times — not starting the server"; exit 1; fi
          echo "[app] prisma:migrate failed (attempt $$attempt/10), retrying in 10s..."
          attempt=$$((attempt + 1))
          sleep 10
        done
        echo "[app] migrations OK — starting server"
        exec su-exec node node src/server.js
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-xyonempleados_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    entrypoint: /bin/sh
    command:
      - -c
      - |
        PGDATA="/var/lib/postgresql/data"
        if [ -f "$$PGDATA/PG_VERSION" ] && [ -n "$$POSTGRES_PASSWORD" ]; then
          echo "[db] Existing database detected — force-syncing password..."
          cp "$$PGDATA/pg_hba.conf" "$$PGDATA/pg_hba.conf.bak"
          printf 'local all all trust\nhost all all all trust\n' > "$$PGDATA/pg_hba.conf"
          docker-entrypoint.sh postgres &
          PG_PID=$$!
          while ! pg_isready -U "$$POSTGRES_USER" -q 2>/dev/null; do sleep 1; done
          SAFE_PW=$$(printf '%s' "$$POSTGRES_PASSWORD" | sed "s/'/''/g")
          psql -U "$$POSTGRES_USER" -d postgres -c "ALTER USER \"$$POSTGRES_USER\" WITH PASSWORD '$$SAFE_PW';"
          echo "[db] Password synced OK — restoring auth config"
          cp "$$PGDATA/pg_hba.conf.bak" "$$PGDATA/pg_hba.conf"
          rm -f "$$PGDATA/pg_hba.conf.bak"
          pg_ctl reload -D "$$PGDATA"
          wait $$PG_PID
        else
          echo "[db] Fresh database — normal startup"
          exec docker-entrypoint.sh postgres
        fi

volumes:
  postgres_data:
  uploads:
